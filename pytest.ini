# `pytest -q` from the repository root (the coding runner's test command) runs the core tests exactly like
# `cd core && pytest -q`: without this file pytest found no configuration here – no importlib mode, no `src` on the
# path, unknown markers – and also collected device_agent/tests, which need their own environment.
# Keep in sync with [tool.pytest.ini_options] in core/pyproject.toml. Inside core/ or device_agent/ pytest still uses
# that package's own pyproject.toml (the nearest configuration wins). The Device Agent: `cd device_agent && pytest -q`.
[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = core/tests
pythonpath = core/src
addopts = --import-mode=importlib
markers =
    integration: needs running Postgres/Ollama
    e2e: needs the full stack running
    coding_runner: needs the coding runner's POSIX process control (skipped on Windows, see core/tests/conftest.py)
