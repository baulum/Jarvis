[project]
name = "jarvis-core"
version = "0.1.0"
description = "J.A.R.V.I.S. core: orchestration, tools, memory, connectors, voice and telephony"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "mcp>=2.3",
    "keyring>=25",
    "croniter>=5",
    "watchfiles>=1.0",
    "python-multipart>=0.0.18",
    "playwright>=1.49",
    "psutil>=6.1",
    "psycopg[binary]>=3.2",
    "jsonschema>=4.23",
    "numpy>=2.1",
    "fastembed>=0.9.0",
    "msgpack>=1.1",
    "livekit>=1.0",
    "livekit-api>=1.0",
    "cryptography>=43",
    "google-auth>=2.35",
    "segno>=1.6",
    "pillow>=13",  # image scaling where macOS sips is missing (Windows, Linux)
    "pypdf>=5",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
antibrow = ["antibrow>=1.0"]
voice = [
    "sounddevice>=0.5.6",
    "onnxruntime>=1.20",
]

[project.scripts]
jarvisctl = "jarvis.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]  # rootdir is core/: tests import this checkout's jarvis, not an editable install of another one
addopts = "--import-mode=importlib"  # unit/ and e2e/ both have a test_voice_pipeline.py
markers = [
    "integration: needs running Postgres/Ollama",
    "e2e: needs the full stack running",
    "coding_runner: needs the coding runner's POSIX process control (skipped on Windows, see tests/conftest.py)",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "S603", "S607", "RUF001", "RUF002", "RUF003", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "E501", "RUF059", "ASYNC109"]
"src/jarvis/config.py" = ["S105"]
"src/jarvis/api/*.py" = ["B008"]
# prompt texts, HTML mail template and the component catalogue: long German string literals
"src/jarvis/social/{concept,emailer,storyboard,captions}.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
