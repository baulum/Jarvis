# J.A.R.V.I.S. main configuration.
# Secrets never live here: they are stored in the macOS Keychain (service "jarvis")
# and managed with `jarvisctl secret set <name>` or the Connector Hub in the app.
# Every value can be overridden with an environment variable JARVIS__SECTION__KEY
# (e.g. JARVIS__SERVER__PORT=9000).

server:
  host: 127.0.0.1          # keep loopback-only locally; on a VPS put a TLS reverse proxy in front
  port: 8765
  public_base_url: ""      # e.g. https://jarvis.example.com — required for Twilio webhooks
  cors_origins:
    - tauri://localhost
    - http://tauri.localhost
    - http://localhost:1420
    - http://127.0.0.1:1420

paths:
  data_dir: ~/Library/Application Support/Jarvis
  log_dir: ~/Library/Logs/Jarvis
  vault_dir: ~/Documents/Jarvis Vault           # Obsidian vault (plain Markdown)
  workspaces_dir: ~/Developer/Jarvis-Workspaces # coding jobs / git worktrees
  projects_dir: ~/Developer/Projects            # customer projects created by playbooks

database:
  host: localhost
  port: 5432
  name: jarvis
  user: jarvis
  password_secret: postgres   # Keychain account holding the DB password

llm:
  # Semantic memory search: embedding model running inside the core (ONNX via fastembed) – no Ollama.
  embedding_model: Qwen/Qwen3-Embedding-0.6B-Q
  embedding_dimensions: 1024
  # Only for the optional legacy provider "hermes" (local Ollama models); unused with claude_code.
  ollama_url: http://127.0.0.1:11434
  agent_model: jarvis-brain
  utility_model: jarvis-brain
  keep_alive: 30m

agent:
  # Agent brain. "claude_code": official Claude Code CLI with Sir's subscription (default).
  # "hermes": legacy option (Hermes Agent + local Ollama model); not used, Ollama is not started.
  provider: claude_code
  claude_binary: claude
  model: sonnet            # default for conversations: sonnet | opus | haiku  (= Claude * 5.5)
  auto_downgrade: true     # simple requests (small talk, short questions, simple actions) use haiku
  utility_model: haiku     # memory extraction, web extraction, screenshot analysis
  # Switch by command ("nimm Opus", "ab jetzt Haiku", "nur diesmal Opus …", "automatische Modellwahl"),
  # in the desktop app or via POST /api/agent/model. Opus is only used when asked for.
  idle_timeout_minutes: 15 # idle conversation processes are stopped and resumed later
  turn_timeout_s: 900      # a Claude turn that hangs longer is killed (it would block every channel)

hermes:
  enabled: false
  profile: jarvis
  # Hermes runs ONE multiplexing host gateway for all profiles; this profile is served under /p/<profile>
  api_url: http://127.0.0.1:8642/p/jarvis
  api_key_secret: hermes-api-key
  request_timeout_s: 300

session:
  idle_timeout_minutes: 120   # sessions expire after inactivity
  max_history_messages: 30

voice:
  enabled: true
  language: de
  wake_word: hey_jarvis
  wake_threshold: 0.4
  stt:
    provider: whisper_cpp
    server_url: http://127.0.0.1:8178
    model: ggml-large-v3-turbo-q5_0.bin
  tts:
    provider: local            # macos | fish_audio | local – local: Jarvis-Stimme auf diesem Mac, ohne API-Kosten
    macos_voice: Anna          # `say -v '?'` lists installed voices
    rate: 185
    cache_max_chars: 80        # kurze, wiederkehrende Sätze nur einmal erzeugen (0 = aus)
    local:                     # scripts/local-tts/server.py (Qwen3-TTS klont voices/jarvis_ref_short.wav)
      server_url: http://127.0.0.1:8179   # läuft der Server nicht, übernimmt Fish Audio (falls aktiv), dann macOS
    fish_audio:
      api_key_secret: fish-audio-api-key
      reference_id: ""         # Fish Audio voice model id
      model: s1
      streaming: true          # WebSocket-Live-TTS: Text geht schon während der Antwort an Fish Audio
      latency: balanced        # low | balanced | normal (Stimme bleibt gleich, nur Pufferung)
      chunk_length: 100        # 100–300; kleiner = früherer erster Ton
  # Endpointing: endet die Äußerung grammatisch vollständig, reichen min_end_of_turn_silence_ms Stille;
  # klingt sie unfertig („… und“, „ähm“), wartet Jarvis bis end_of_turn_silence_ms.
  end_of_turn_silence_ms: 1100   # längste Denkpause
  min_end_of_turn_silence_ms: 400
  speculative_stt_ms: 280        # Whisper startet schon in der Pause (überlappt mit dem Endpointing)
  vad_min_rms: 180               # Mindestpegel für Sprache (niedriger = leise Silben zählen als Sprache)
  barge_in: auto                 # auto | voice | wake_word – auto: per Stimme (ohne Echo-Unterdrückung relativ zum Eigenecho), „Hey Jarvis“ geht immer
  barge_in_echo_ratio: 1.8       # höher = weniger Fehlauslösungen durch Jarvis' eigene Stimme, aber lauter sprechen nötig
  barge_in_ms: 320               # so lange muss Sir sprechen, um Jarvis zu unterbrechen (Barge-in per Stimme)
  native_audio: true             # Swift-Audiohelfer: lückenlose Streaming-Wiedergabe (sonst sounddevice/afplay)
  echo_cancellation: false       # macOS-Echo-Unterdrückung – experimentell: dämpfte im Test auch Sirs Stimme im Raum
  conversation_window_s: 15      # nach einer Antwort hört Jarvis so lange weiter zu – ohne „Hey Jarvis“
  max_utterance_s: 30
  followup_window_s: 6         # keep listening after a reply without wake word
  # "Hey Jarvis, wake up" / "wach auf" (macOS) – MP3 + programs. "Jarvis, beende das Gespräch" ends the conversation.
  # enabled/sound/volume/apps are start values only: the desktop app (Einstellungen → Weckroutine) stores Sir's
  # choice in ~/Library/Application Support/Jarvis/wakeup.json, which then takes precedence.
  wakeup:
    enabled: true
    sound: ""                  # path to an MP3; empty = built-in power-up sound
    volume: 1.0
    say: "Zu Ihren Diensten, Sir. Alle Systeme sind online."   # "" = only the sound
    apps: []                   # opened in this order (open -a), e.g. ["Visual Studio Code", "/Applications/Safari.app"]
    app_delay_s: 0.8

telephony:
  enabled: true
  provider: twilio             # twilio | local_test
  owner_numbers: []            # E.164 numbers of the owner (used for outbound + caller hints only)
  pin_secret: phone-pin        # Keychain account with the caller PIN (caller ID alone never authenticates)
  max_calls_per_hour: 10
  twilio:
    account_sid_secret: twilio-account-sid
    auth_token_secret: twilio-auth-token
    from_number: ""

notifications:
  default_channels: [desktop]
  quiet_hours: {start: "22:30", end: "07:00"}
  rules:
    - event: task.completed
      channels: [desktop, telegram, mobile]
    - event: task.failed
      channels: [desktop, telegram, mobile]
    - event: task.input_required     # a task waits for Sir's answer: without this only the desktop knew
      channels: [desktop, telegram, mobile]
    - event: approval.requested
      channels: [desktop, telegram, mobile]
    - event: coding.finished
      channels: [desktop, telegram, mobile]
    - event: coding.interrupted      # a restart ended a running coding job
      channels: [desktop, telegram, mobile]
    - event: agent.usage
      channels: [desktop, mobile]
    - event: backup.failed
      channels: [desktop, mobile]
    - event: app_update.failed       # Build der Handy-App fehlgeschlagen (Ursache in der Meldung)
      channels: [desktop, mobile]
    - event: app_update.ready        # neue Handy-App gebaut; das Handy meldet sich selbst mit „Update bereit“
      channels: [desktop]
    - event: system.critical
      channels: [desktop, telegram, phone, mobile]
      bypass_quiet_hours: true

mobile:
  # J.A.R.V.I.S.-App (Android). Wer was bekommt (still/Push/Anruf), steht in der App unter
  # „Benachrichtigungen“ bzw. in ~/Library/Application Support/Jarvis/alert-policy.json.
  enabled: true
  access_token_ttl_s: 600        # Zugriffstoken 10 min, danach Erneuerung mit Gerätesignatur
  refresh_token_ttl_days: 30
  gateway:                       # TLS-Zugang fürs Smartphone (nur Mobile-Pfade, Zertifikat per QR gepinnt)
    enabled: true
    host: 0.0.0.0
    port: 8767
    advertise_urls: []           # leer = LAN-/Tailscale-Adressen automatisch; z. B. https://mac.tailnet.ts.net:8767
    tls: self_signed             # self_signed | external (Tailscale serve / Reverse-Proxy mit echtem Zertifikat)
  livekit:                       # selbst gehosteter WebRTC-Server (brew install livekit)
    enabled: true
    manage_process: true
    internal_url: ws://127.0.0.1:7880
    public_url: ""               # leer = Signalisierung über das TLS-Gateway (wss://<gateway>/rtc)
    node_ip: ""                  # leer = alle lokalen Schnittstellen (LAN + Tailscale) als ICE-Kandidaten
    rtc_tcp_port: 7881
    rtc_udp_start: 50000
    rtc_udp_end: 50100
  firebase:                      # aus google-services.json; Dienstkonto: jarvisctl secret set fcm-service-account
    project_id: "baulum-ecf31"
    api_key: "AIzaSyAaqjhmolr2QvxGhalxwWtNG2pI-duE9FQ"   # öffentliche Client-Kennung der Android-App (kein Geheimnis)
    app_id: "1:673885865193:android:27d44eb10bcb6a87789c78"
    sender_id: "673885865193"
  calls:
    ring_timeout_s: 45
    max_calls_per_hour: 4
    min_minutes_between_calls: 3
    max_duration_minutes: 30
  app_update:                    # OTA-Updates der Android-App (docs/MOBILE.md › App-Updates)
    enabled: true
    auto_build: true             # Änderungen an apps/jarvis_mobile auf main → signierte APK bauen und verteilen
    branch: main
    poll_interval_minutes: 10
    keep_releases: 5             # mindestens 3 (Rollback)
    target_platform: android-arm64

backup:
  # Nightly PostgreSQL dump + vault + config, AES-256-GCM encrypted, with retention. Secrets are never included.
  # `jarvisctl backup key` prints the key – store it in a password manager (it lives in the Keychain only).
  enabled: true
  directory: ~/Backups/Jarvis
  at: "03:30"
  keep_recent: 14
  keep_weekly: 8
  encrypt: true

coding:
  # Alle Coding-Jobs laufen über diesen Befehl (Programmname im PATH oder absoluter Pfad); kein Fallback auf "claude".
  claude_command: claudeb
  # "claudeb" ist bei Sir ein zsh-Alias (claude --dangerously-skip-permissions), kein Programm. Der Runner löst
  # ihn über diese Tabelle auf (ein echtes Programm "claudeb" im PATH hätte Vorrang). Das Bypass-Flag
  # (--dangerously-skip-permissions) ist auf Sirs ausdrücklichen Wunsch aktiv; deshalb restricted: false
  # (--restricted verweigert das Flag), und die Freigabelisten unten greifen nicht mehr als Schranke.
  claude_aliases:
    claudeb: [claude, --dangerously-skip-permissions]
  restricted: false
  # claude_env:                # optionale Umgebung für den Befehl, z. B. CLAUDE_CONFIG_DIR: ~/.claude-b
  # Zusätzliche PATH-Einträge für Coding-Jobs (der Core läuft unter launchd ohne Shell-Profil): Flutter-SDK.
  extra_path: [/Users/paul/Documents/flutter/bin]
  # Modell für Coding-Jobs ohne Angabe: haiku | sonnet | opus; leer = aktuell im Chat gewähltes Modell.
  default_model: ""
  # Coding-Jobs gleichzeitig, jeder im eigenen Worktree; weitere warten als "queued". Ausliefern (Merge nach main,
  # Deploy, Aufräumen) geschieht pro Repository nacheinander; Jobs für dieselbe Kundenseite laufen nacheinander.
  max_parallel_jobs: 3
  # Zeitlimit je Coding-Job in Minuten (Pausen zählen nicht); danach bricht der Job mit "Zeitlimit … überschritten" ab.
  job_timeout_minutes: 180
  allowed_tools: [Read, Edit, Write, Glob, Grep, "Bash(npm:*)", "Bash(npx:*)", "Bash(pnpm:*)",
                  "Bash(node:*)", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git add:*)",
                  "Bash(git commit:*)", "Bash(ls:*)", "Bash(mkdir:*)", "Bash(python3:*)", "Bash(uv:*)",
                  "Bash(git rm:*)", "Bash(git mv:*)", "Bash(rm:*)", "Bash(mv:*)", "Bash(cp:*)", "Bash(cat:*)",
                  "Bash(curl:*)", "Bash(lsof:*)", "Bash(open:*)", "Bash(flutter:*)", "Bash(dart:*)",
                  # reine Lesebefehle (auch als Teil von && / Pipes nötig: jeder Teil wird einzeln geprüft)
                  "Bash(git log:*)", "Bash(git show:*)", "Bash(git worktree list:*)", "Bash(git branch)",
                  "Bash(git branch -a:*)", "Bash(git branch -r:*)", "Bash(git branch -v:*)",
                  "Bash(git branch -vv:*)", "Bash(git branch --list:*)", "Bash(git branch --show-current)",
                  "Bash(head:*)", "Bash(tail:*)", "Bash(wc:*)", "Bash(which:*)"]
  # false = Claude Code läuft direkt auf dem Mac (Netzwerk, lokale Ports, Google Fonts, next build funktionieren)
  sandbox: false
  # Zusätzlich zum Job-Worktree (exakte Pfade, keine Wildcards). Lesen: Edit/Write dort werden verweigert.
  extra_read_dirs: [/Users/paul/Downloads, /Users/paul/Developer/Jarvis-Workspaces/repos]
  extra_write_dirs: [/Users/paul/Developer/Projects/night-motion-graphics]
  # Standard-Ablauf nach einem GRÜNEN Job: Job-Branch pushen → PR (kein Draft) → PR mergen → Supabase deployen
  # (db push / functions deploy, nur wenn supabase/ im Projekt liegt) → Job-Branch und Worktree löschen.
  # Rot/Fehler/Abbruch: WIP-Commit und Job-Branch pushen, aber kein Merge, kein Deploy; der Worktree bleibt.
  auto_ship: true
  ship_base_branch: main
  ship_merge_method: squash        # squash | merge | rebase
  supabase_command: supabase       # Programmname im PATH oder absoluter Pfad

creative:
  # KIE.ai-Modelle für image_generate / video_generate (Connector „KIE.ai“). Überschreibbar per
  # JARVIS__CREATIVE__IMAGE_MODEL usw.; ein in der App beim Connector eingetragenes Modell hat Vorrang.
  image_model: gpt-image-2-5-sunburst-text-to-image        # Text → Bild
  image_edit_model: gpt-image-2-5-sunburst-image-to-image  # mit Referenzbild
  video_model: wan/3-0-video
  image_resolution: 1K       # 1K | 2K | 4K
  video_resolution: 720P     # 480P | 720P | 1080P
  video_timeout_s: 600       # Warten auf ein Video; + Up-/Download muss unter agent.turn_timeout_s (900) bleiben

browser:
  headless: true
  default_timeout_ms: 20000
  max_content_chars: 12000

scheduler:
  enabled: true
  tick_seconds: 20

social_media:
  # Tägliches PJE-Systems-Werbevideo (core/src/jarvis/social, Remotion-Projekt social/, docs/SOCIAL_MEDIA.md).
  # Schalter, Uhrzeit, E-Mail und Autopost stellt Sir in der App ein (Social Media › Automatisierung);
  # die Uhrzeit ist der Zeitplan „PJE Systems Daily Social Video“ im normalen Zeitplaner.
  enabled: true
  node_binary: node
  ffmpeg_binary: ffmpeg
  ffprobe_binary: ffprobe
  owner_email: paulhoflich@gmail.com   # E-Mails an diese Adresse laufen ohne Einzelfreigabe (Sirs Freigabe 2026-10-28)
  video_recipients:                    # weitere Empfänger fertiger Videos neben Sir (gelten als freigegeben)
    - bagy2014@gmail.com               # Bagy (Blagoja Ljubeski), Geschäftspartner
  default_time: "08:00"
  timezone: Europe/Berlin
  concept_model: opus                 # Idee, Skript, Storyboard, Captions (Sir: alles mit Opus 5.5, 2026-10-28)
  qa_model: opus                       # Frame-Analyse, Rechtschreibung
  effort: medium                       # --effort der Claude-CLI für alle Social-Media-Aufrufe
  max_render_attempts: 3
  max_video_mb: 19
  email_attachment_max_mb: 18
  link_ttl_hours: 72
  public_base_url: ""                  # für Download-Links in der Mail; leer = server.public_base_url
